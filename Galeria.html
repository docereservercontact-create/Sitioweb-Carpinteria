<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Proyectos | Carpintería León</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brown: #5c3a17;
            --wood: #8b5a2b;
            --gold: #d4a373;
            --cream: #f8f4ef;
            --ink: #2b2d42;
            --muted: #6c757d;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--cream);
            color: var(--ink);
        }

        .header {
            align-items: center;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 4px 18px rgba(92, 58, 23, 0.1);
            display: flex;
            justify-content: space-between;
            padding: 0.8rem 8%;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo img {
            display: block;
            height: 50px;
            width: auto;
        }

        .nav {
            align-items: center;
            display: flex;
            gap: 1.8rem;
        }

        .nav a {
            color: var(--ink);
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
        }

        .nav a:hover {
            color: var(--wood);
        }

        .nav .btn-nav {
            background: var(--wood);
            border-radius: 8px;
            color: var(--white);
            padding: 0.6rem 1.4rem;
        }

        .menu-toggle {
            color: var(--brown);
            cursor: pointer;
            display: none;
            font-size: 1.5rem;
        }

        .page-heading {
            background: linear-gradient(135deg, var(--brown), #3d260f);
            color: var(--white);
            padding: 5rem 1.5rem 6rem;
            text-align: center;
        }

        .eyebrow {
            color: var(--gold);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 4rem);
            line-height: 1.1;
            margin: 0.8rem auto 1rem;
            max-width: 760px;
        }

        .page-heading p {
            color: #f4eae1;
            margin: 0 auto;
            max-width: 620px;
        }

        .gallery-shell {
            margin: -3.5rem auto 5rem;
            max-width: 1250px;
            padding: 0 1.5rem;
            position: relative;
        }

        .filters {
            align-items: center;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(92, 58, 23, 0.12);
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 0.75rem;
        }

        .filter-btn {
            background: transparent;
            border: 0;
            border-radius: 7px;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 0.7rem 1rem;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--wood);
            color: var(--white);
        }

        .photo-grid {
            display: grid;
            gap: 1rem;
            grid-auto-rows: 230px;
            grid-template-columns: repeat(4, 1fr);
        }

        .photo-card {
            background: var(--white);
            border-radius: 10px;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        .photo-card:nth-child(2),
        .photo-card:nth-child(5) {
            grid-row: span 2;
        }

        .photo-card:nth-child(3) {
            grid-column: span 2;
        }

        .photo-card[hidden] {
            display: none;
        }

        .photo-card img {
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            width: 100%;
        }

        .photo-card:hover img {
            transform: scale(1.06);
        }

        .photo-caption {
            background: linear-gradient(transparent, rgba(43, 45, 66, 0.9));
            bottom: 0;
            color: var(--white);
            left: 0;
            padding: 3rem 1.1rem 1rem;
            position: absolute;
            right: 0;
        }

        .photo-caption h2 {
            font-size: 1rem;
            margin-bottom: 0.2rem;
        }

        .photo-caption p {
            color: #f4eae1;
            font-size: 0.78rem;
        }

        .lightbox {
            align-items: center;
            background: rgba(20, 16, 12, 0.88);
            display: flex;
            inset: 0;
            justify-content: center;
            opacity: 0;
            padding: 2rem;
            pointer-events: none;
            position: fixed;
            transition: opacity 0.25s ease;
            z-index: 20;
        }

        .lightbox.open {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox figure {
            margin: 0;
            max-height: 90vh;
            max-width: 1000px;
            position: relative;
            width: 100%;
        }

        .lightbox img {
            border-radius: 8px;
            display: block;
            max-height: 78vh;
            object-fit: contain;
            width: 100%;
        }

        .lightbox figcaption {
            color: var(--white);
            padding-top: 0.8rem;
            text-align: center;
        }

        .close-lightbox {
            background: var(--white);
            border: 0;
            border-radius: 50%;
            color: var(--brown);
            cursor: pointer;
            font-size: 1.2rem;
            height: 42px;
            position: absolute;
            right: 0;
            top: -3.5rem;
            width: 42px;
        }

        .footer {
            background: var(--brown);
            color: var(--white);
            padding: 2.5rem 1.5rem;
            text-align: center;
        }

        .footer img {
            filter: brightness(0) invert(1);
            height: 55px;
            margin-bottom: 0.8rem;
            width: auto;
        }

        .footer p {
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .nav {
                align-items: stretch;
                background: var(--white);
                display: none;
                flex-direction: column;
                gap: 0;
                left: 0;
                padding: 0.8rem 8%;
                position: absolute;
                right: 0;
                top: 100%;
            }

            .nav.active {
                display: flex;
            }

            .nav a {
                padding: 0.8rem 0;
            }

            .nav .btn-nav {
                text-align: center;
            }

            .photo-grid {
                grid-auto-rows: 190px;
                grid-template-columns: repeat(2, 1fr);
            }

            .photo-card:nth-child(2),
            .photo-card:nth-child(5) {
                grid-row: span 1;
            }

            .photo-card:nth-child(3) {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a class="logo" href="index.html#inicio">
            <img src="Carpinteria León_Logo.png" alt="Carpintería León">
        </a>
        <nav class="nav" id="nav-menu">
            <a href="index.html#inicio">Inicio</a>
            <a href="index.html#servicios">Servicios</a>
            <a href="index.html#nosotros">Nosotros</a>
            <a href="Galeria.html" aria-current="page">Galería</a>
            <a href="Contacto.html" class="btn-nav">Contacto</a>
        </nav>
        <button class="menu-toggle" id="mobile-menu" type="button" aria-label="Abrir menú" aria-expanded="false">
            <i class="fas fa-bars"></i>
        </button>
    </header>

    <main>
        <section class="page-heading">
            <p class="eyebrow">Carpintería León</p>
            <h1>Ideas que toman forma</h1>
            <p>Una selección de proyectos hechos a medida, con materiales honestos y atención al detalle.</p>
        </section>

        <section class="gallery-shell" aria-label="Galería de proyectos">
            <div class="filters" role="group" aria-label="Filtrar proyectos">
                <button class="filter-btn active" type="button" data-filter="todos">Todos</button>
            </div>

            <div class="photo-grid" id="photo-grid"></div>
        </section>
    </main>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Vista ampliada" aria-hidden="true">
        <figure>
            <button class="close-lightbox" id="close-lightbox" type="button" aria-label="Cerrar imagen"><i class="fas fa-times"></i></button>
            <img id="lightbox-image" src="" alt="">
            <figcaption id="lightbox-caption"></figcaption>
        </figure>
    </div>

    <footer class="footer">
        <img src="Carpinteria León_Logo.png" alt="Carpintería León">
        <p>&copy; 2026 Carpintería León. Todos los derechos reservados.</p>
    </footer>

    <script>
        const mobileMenu = document.getElementById('mobile-menu');
        const navMenu = document.getElementById('nav-menu');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const photoGrid = document.getElementById('photo-grid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightbox-image');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const closeLightbox = document.getElementById('close-lightbox');

        for (let number = 1; number <= 128; number += 1) {
            const card = document.createElement('article');
            card.className = 'photo-card';
            card.innerHTML = `
                <img src="Galeria/Galaria  (${number}).jpg" alt="Proyecto de carpintería ${number}" loading="lazy">
                <div class="photo-caption"><h2>Carpintería León</h2></div>
            `;
            photoGrid.appendChild(card);
        }

        const photoCards = document.querySelectorAll('.photo-card');

        mobileMenu.addEventListener('click', () => {
            const isOpen = navMenu.classList.toggle('active');
            mobileMenu.setAttribute('aria-expanded', String(isOpen));
        });

        navMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('active');
                mobileMenu.setAttribute('aria-expanded', 'false');
            });
        });

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                filterButtons.forEach(item => item.classList.remove('active'));
                button.classList.add('active');
                const filter = button.dataset.filter;

                photoCards.forEach(card => {
                    card.hidden = filter !== 'todos' && card.dataset.category !== filter;
                });
            });
        });

        photoCards.forEach(card => {
            card.addEventListener('click', () => {
                const image = card.querySelector('img');
                const title = card.querySelector('h2').textContent;
                lightboxImage.src = image.src;
                lightboxImage.alt = image.alt;
                lightboxCaption.textContent = title;
                lightbox.classList.add('open');
                lightbox.setAttribute('aria-hidden', 'false');
                closeLightbox.focus();
            });
        });

        function hideLightbox() {
            lightbox.classList.remove('open');
            lightbox.setAttribute('aria-hidden', 'true');
        }

        closeLightbox.addEventListener('click', hideLightbox);
        lightbox.addEventListener('click', event => {
            if (event.target === lightbox) hideLightbox();
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') hideLightbox();
        });
    </script>
</body>
</html>
